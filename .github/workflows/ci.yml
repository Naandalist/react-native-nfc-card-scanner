name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn typecheck
      - run: yarn build
